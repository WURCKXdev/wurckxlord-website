name: Build FLUX plugin (Windows)

on:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S plugin -B build -A x64 -DFLUX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: build\Release\FluxTests.exe

      - name: Package app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/FLUX_artefacts/Release/VST3/FLUX.vst3" dist/
          Copy-Item "build/FLUX_artefacts/Release/Standalone/FLUX.exe" dist/
          Copy-Item "plugin/INSTALL.txt" dist/

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DDist="$PWD\dist" /DAppVersion="0.1.${{ github.run_number }}" /O"$PWD" plugin\installer\FLUX.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Make the shareable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force share/FLUX/Portable | Out-Null
          Copy-Item FLUX-Setup.exe share/FLUX/
          Copy-Item "plugin/installer/READ ME FIRST.txt" share/FLUX/
          Copy-Item -Recurse dist/* share/FLUX/Portable/
          Compress-Archive -Path share/FLUX -DestinationPath FLUX-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: FLUX-Windows-x64
          path: share

      - name: Publish zip as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flux-build-${{ github.run_number }}
          name: FLUX for Windows (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            FLUX-Windows-x64.zip
            FLUX-Setup.exe
          body: |
            FLUX VST3 + standalone for Windows x64.
            - **FLUX-Setup.exe** - the installer (VST3 + standalone). Just run it.
            - **FLUX-Windows-x64.zip** - a folder with the installer, a READ ME FIRST, and a portable version.
            Windows may show "Windows protected your PC" (the app is not code-signed): click More info -> Run anyway.
